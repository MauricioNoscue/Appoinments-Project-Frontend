<app-toolbar
  title="Solicitudes de Modificación"
  addLabel=" "
  addSubtitle=""
    [showAddButton]="false" 
  [data]="dataSource"
  [searchFields]="['reason', 'statusTypeName']"
  (filteredData)="dataSourceFiltered = $event">
</app-toolbar>

<app-generic-table
  [dataSource]="dataSourceFiltered"
  [columns]="displayedColumns"
  [columnDefs]="columnDefs"
  (actionClicked)="handleAction($event)">
</app-generic-table>
